<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칼부림 깎는 노인</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#c89b3c; --gold-lt:#f0c070; --gold-dk:#785a28;
    --bg:#010a13; --bg2:#0a1628; --bg3:#0d1f3c; --panel:#071020;
    --border:#1e3a5f; --blue:#0ac8b9; --blue-dk:#005a82;
    --red:#c83e3e; --green:#28c87a;
    --text:#a0b4c8; --text-lt:#cddcec; --win:#28c87a; --lose:#c83e3e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text-lt);font-family:'Rajdhani',sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;z-index:0;background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(10,40,80,.5) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%,rgba(200,155,60,.08) 0%,transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(14,35,65,.15) 60px,rgba(14,35,65,.15) 61px),
    repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(14,35,65,.15) 60px,rgba(14,35,65,.15) 61px);
    pointer-events:none;}

  header{position:relative;z-index:10;text-align:center;padding:48px 24px 32px;
    border-bottom:1px solid var(--gold-dk);
    background:linear-gradient(180deg,rgba(200,155,60,.06) 0%,transparent 100%);}
  header h1{font-family:'Cinzel',serif;font-size:clamp(22px,4vw,42px);font-weight:700;
    color:var(--gold-lt);letter-spacing:.12em;text-shadow:0 0 30px rgba(200,155,60,.4);}
  header p{margin-top:8px;color:var(--text);font-size:13px;letter-spacing:.2em;text-transform:uppercase;}
  .header-line{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px auto 0;max-width:400px;}
  .header-line span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dk));}
  .header-line span:last-child{background:linear-gradient(90deg,var(--gold-dk),transparent);}

  nav{position:sticky;top:0;z-index:100;background:rgba(1,10,19,.95);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:0;display:flex;gap:0;overflow-x:auto;}
  nav::-webkit-scrollbar{height:3px;} nav::-webkit-scrollbar-thumb{background:var(--gold-dk);}
  .tab{padding:14px 18px;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--text);cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;
    background:none;border-top:none;border-left:none;border-right:none;}
  .tab:hover{color:var(--gold-lt);} .tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:32px 24px 60px;}
  .section{display:none;animation:fadeIn .3s ease;} .section.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .sec-title{font-family:'Cinzel',serif;font-size:20px;color:var(--gold-lt);
    margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--gold-dk);
    display:flex;align-items:center;gap:12px;}
  .sec-title .num{background:var(--gold);color:var(--bg);width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}

  /* ── Avatar images ── */
  .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold-dk);flex-shrink:0;background:var(--bg3);}
  .avatar.champ{border-radius:6px;border-color:var(--border);}
  .avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;
    border:1px solid var(--gold-dk);flex-shrink:0;background:var(--bg3);}
  .avatar-sm.champ{border-radius:4px;border-color:var(--border);}

  /* ── Rank card ── */
  .rank-list{display:flex;flex-direction:column;gap:8px;}
  .rank-card{display:grid;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
    border:1px solid var(--border);border-radius:6px;padding:12px 16px;
    align-items:center;gap:0 12px;
    transition:border-color .2s,transform .15s;position:relative;overflow:hidden;}
  .rank-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--gold-dk);transition:background .2s;}
  .rank-card:hover{border-color:var(--gold-dk);transform:translateX(3px);}
  .rank-card:hover::before{background:var(--gold);}
  .rank-card.r1::before{background:var(--gold);}
  .rank-card.r2::before{background:#c0c0c0;}
  .rank-card.r3::before{background:#cd7f32;}

  .rank-pos{font-family:'Cinzel',serif;font-size:20px;font-weight:700;
    color:var(--gold-dk);min-width:36px;text-align:center;display:flex;align-items:center;justify-content:center;}
  .rank-card.r1 .rank-pos{color:var(--gold);text-shadow:0 0 12px rgba(200,155,60,.5);}
  .rank-card.r2 .rank-pos{color:#c0c0c0;}
  .rank-card.r3 .rank-pos{color:#cd7f32;}
  .rank-name{font-size:15px;font-weight:600;color:var(--text-lt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-meta{font-size:12px;color:var(--text);margin-top:2px;}
  .rank-stat{font-size:18px;font-weight:700;color:var(--gold);text-align:right;}
  .rank-sub{font-size:11px;color:var(--text);text-align:right;margin-top:1px;}
  .bar-wrap{grid-column:1/-1;margin-top:8px;background:rgba(0,0,0,.3);border-radius:2px;height:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dk),var(--gold));transition:width 1s ease;}
  .bar-fill.win{background:linear-gradient(90deg,#1a7a4a,var(--green));}
  .bar-fill.kda{background:linear-gradient(90deg,var(--blue-dk),var(--blue));}

  .player-rank-card{grid-template-columns:36px 40px 1fr 110px;}
  .rank-name-row{display:flex;align-items:center;gap:10px;min-width:0;}
  .rank-name-main{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
  .rank-name-main .rank-name{margin:0;}
  .rank-most-champs{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .rank-most-champs .avatar-sm{width:22px;height:22px;border-radius:50%;border-color:rgba(255,255,255,.18);}
  .rank-record-badge{display:flex;align-items:center;overflow:hidden;border-radius:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);height:22px;flex:1;min-width:0;}
  .rank-record-badge .win{background:#5383e8;color:#fff;padding:0 16px;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .rank-record-badge .lose{background:#e84f5f;color:#fff;padding:0 16px;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .rank-record-badge .wr{color:#ff6b6b;padding:0 8px;font-size:12px;font-weight:700;display:flex;align-items:center;height:100%;}
  .top-player-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex-shrink:0;}
  .top-player-badge svg{display:block;width:28px;height:28px;filter:drop-shadow(0 0 6px rgba(138,96,255,.32));}
  .rank-pos .top-player-badge{display:none;}
  .mobile-only{display:none;}
  .desktop-only{display:flex;}
  @media(min-width:761px){
    .player-rank-card .rank-meta.mobile-only{display:none !important;}
    .player-rank-card .bar-wrap{display:none;}
  }
  @media(max-width:760px){
    .desktop-only{display:none !important;}
    .mobile-only{display:block;}
  }

  /* ── Player select buttons ── */
  .player-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .player-btn{padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;}
  .player-btn:hover{border-color:var(--gold-dk);color:var(--gold-lt);}
  .player-btn.active{background:rgba(200,155,60,.1);border-color:var(--gold);color:var(--gold);}
  .player-btn img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-dk);}

  .player-content{display:none;} .player-content.active{display:block;animation:fadeIn .25s ease;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:700px){.two-col{grid-template-columns:1fr;}}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;}
  @media(max-width:900px){.three-col{grid-template-columns:1fr;}}
  .sub-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;}
  .sub-panel h3{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);margin-bottom:16px;
    padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:.08em;}

  /* ── Mini list (sub-panels) ── */
  .mini-list{display:flex;flex-direction:column;gap:6px;}
  .mini-row{display:flex;align-items:center;gap:8px;padding:7px 10px;
    background:rgba(0,0,0,.2);border-radius:4px;border-left:2px solid var(--border);}
  .mini-row.r1{border-left-color:var(--gold);}
  .mini-row.r2{border-left-color:#c0c0c0;}
  .mini-row.r3{border-left-color:#cd7f32;}
  .mini-pos{font-size:11px;color:var(--text);min-width:16px;text-align:center;}
  .mini-name{flex:1;font-size:14px;font-weight:600;color:var(--text-lt);}
  .mini-val{font-size:14px;font-weight:700;color:var(--gold);}
  .mini-sub{font-size:11px;color:var(--text);}

  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px;}
  .stat-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;text-align:center;}
  .stat-box .sv{font-size:22px;font-weight:700;color:var(--gold);}
  .stat-box .sl{font-size:11px;color:var(--text);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}


  .sort-btn{padding:6px 14px;background:var(--bg3);border:1px solid var(--border);
    border-radius:4px;color:var(--text);font-family:'Rajdhani',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .sort-btn:hover{border-color:var(--gold-dk);color:var(--gold-lt);}
  .sort-btn.active{background:rgba(200,155,60,.12);border-color:var(--gold);color:var(--gold);}
  .empty{color:var(--text);font-size:13px;text-align:center;padding:24px;}
  ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}


  /* ── Triplet styles ── */
  .triplet-controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;align-items:center;}
  .triplet-controls label{font-size:12px;color:var(--text);letter-spacing:.08em;text-transform:uppercase;}
  .triplet-controls select{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
    color:var(--text-lt);padding:6px 10px;font-family:'Rajdhani',sans-serif;font-size:13px;cursor:pointer;}
  .triplet-controls select:focus{outline:none;border-color:var(--gold);}

  .viz-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .viz-tab{padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--text);cursor:pointer;
    border-bottom:2px solid transparent;transition:all .2s;background:none;
    border-top:none;border-left:none;border-right:none;}
  .viz-tab:hover{color:var(--gold-lt);}
  .viz-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .viz-panel{display:none;} .viz-panel.active{display:block;}
  .comb-panel{display:none;} .comb-panel.active{display:block;}

  /* ── Match history ── */
  .history-list{display:flex;flex-direction:column;gap:10px;}
  .history-card{display:grid;grid-template-columns:140px minmax(220px,1fr) 240px;gap:10px;align-items:stretch;
    border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:transform .15s,border-color .2s,box-shadow .2s;
    background:linear-gradient(135deg,rgba(15,25,48,.96) 0%,rgba(20,32,58,.96) 100%);min-height:112px;}
  .history-card:hover{transform:translateX(3px);}
  .history-card.win-focus{border-color:rgba(83,131,232,.65);box-shadow:0 0 0 1px rgba(83,131,232,.16) inset;background:linear-gradient(135deg,rgba(40,63,112,.96) 0%,rgba(34,49,84,.96) 100%);}
  .history-card.lose-focus{border-color:rgba(232,83,101,.7);box-shadow:0 0 0 1px rgba(232,83,101,.16) inset;background:linear-gradient(135deg,rgba(102,51,62,.96) 0%,rgba(82,47,57,.96) 100%);}
  .history-card.all-mode{grid-template-columns:1fr 1fr;gap:0;min-height:112px;}
  .history-side{padding:10px 12px;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;justify-content:center;}
  .history-side.win{background:rgba(83,131,232,.12);}
  .history-side.lose{background:rgba(232,83,101,.12);}
  .history-mode{font-size:13px;font-weight:700;line-height:1.1;margin-bottom:4px;}
  .history-side.win .history-mode{color:#6ea8ff;}
  .history-side.lose .history-mode{color:#ff7f92;}
  .history-age{font-size:12px;color:var(--text);margin-bottom:10px;}
  .history-result-main{font-size:15px;font-weight:700;line-height:1.1;}
  .history-side.win .history-result-main{color:#6ea8ff;}
  .history-side.lose .history-result-main{color:#ff7f92;}
  .history-result-sub{font-size:12px;color:var(--text);margin-top:4px;}
  .history-center{padding:8px 0;display:grid;grid-template-columns:60px minmax(160px,1fr) auto;gap:10px;align-items:center;}
  .history-champ-wrap{display:flex;justify-content:center;}
  .history-champ-box{position:relative;width:52px;height:52px;}
  .history-champ-box .avatar{width:52px;height:52px;border-radius:10px;border:2px solid rgba(255,255,255,.14);}
  .history-summary{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;}
  .history-player-name{font-size:14px;font-weight:700;color:#f2f5ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-kda{font-size:18px;font-weight:700;color:#f2f5ff;line-height:1;}
  .history-kda .history-deaths{color:#ff6b81;}
  .history-ratio{font-size:12px;color:var(--text);}
  .history-meta{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0;padding-right:10px;}
  .history-meta-line{font-size:12px;color:var(--text-lt);}
  .history-meta-line .accent{color:var(--gold-lt);font-weight:700;}
  .history-badge{padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.08);color:var(--text-lt);}
  .history-badge.win{background:rgba(83,131,232,.18);border-color:rgba(83,131,232,.38);color:#d9e6ff;}
  .history-badge.lose{background:rgba(232,83,101,.18);border-color:rgba(232,83,101,.4);color:#ffd9df;}
  .history-right{padding:8px 12px;border-left:1px solid rgba(255,255,255,.06);display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .history-team-col{min-width:0;}
  .history-team-list{display:flex;flex-direction:column;gap:3px;}
  .history-team-player{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:center;font-size:12px;color:#c7d2e5;}
  .history-team-player .avatar-sm{width:22px;height:22px;border-width:1px;}
  .history-team-player.focus{font-weight:700;color:#fff;}
  .history-team-player.focus .history-team-name{color:var(--gold-lt);}
  .history-team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-overview-side{position:relative;padding:10px 14px;display:flex;align-items:center;gap:14px;min-height:112px;}
  .history-overview-side.left{border-right:1px solid rgba(255,255,255,.06);}
  .history-overview-side.win{background:linear-gradient(135deg,rgba(83,131,232,.18) 0%,rgba(83,131,232,.08) 100%);}
  .history-overview-side.lose{background:linear-gradient(135deg,rgba(232,83,101,.18) 0%,rgba(232,83,101,.08) 100%);}
  .history-overview-mark{font-family:'Cinzel',serif;font-size:38px;font-weight:700;line-height:1;min-width:34px;text-align:center;opacity:.95;}
  .history-overview-side.win .history-overview-mark{color:#6ea8ff;text-shadow:0 0 18px rgba(83,131,232,.2);}
  .history-overview-side.lose .history-overview-mark{color:#ff7f92;}
  .history-overview-date{position:absolute;top:8px;left:12px;font-size:11px;color:var(--text);}
  .history-overview-team{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .history-overview-side.left .history-team-player{grid-template-columns:minmax(0,1fr) 22px;}
  .history-overview-side.left .history-team-name{text-align:right;}
  @media(max-width:1100px){.history-card{grid-template-columns:130px minmax(180px,1fr) 220px;}}

  /* ── Champion combined: table format ── */
  .comb-mobile-search{display:none;}
  .comb-mobile-back{display:none;}
  .comb-champ-table{width:100%;}
  .comb-champ-thead,.comb-champ-row{display:grid;grid-template-columns:20px 16px 26px 1fr 46px 40px;
    gap:0 4px;align-items:center;padding:3px 6px;}
  .comb-champ-thead{border-bottom:1px solid var(--border);margin-bottom:4px;padding-bottom:5px;border-left:2px solid transparent;}
  .comb-th{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .comb-th.sortable{cursor:pointer;user-select:none;}
  .comb-th.sortable:hover{color:var(--gold-lt);}
  .comb-th.sort-active{color:var(--gold);font-weight:700;}
  .comb-champ-row{cursor:pointer;border-radius:3px;border-left:2px solid transparent;transition:background .15s;}
  .comb-champ-row:hover{background:rgba(255,255,255,.05);}
  .comb-champ-row.active{background:rgba(200,155,60,.1);border-left-color:var(--gold);}

  @media(max-width:760px){
    .player-btn .btn-label{display:none;}
    .player-btn{padding:4px;gap:0;}
    main{padding:16px 8px 40px;}
    .history-list{gap:8px;overflow-x:hidden;width:100%;}
    .history-card{
      width:100%;
      min-height:auto;
      gap:8px;
      grid-template-columns:minmax(88px,18vw) minmax(0,1fr) minmax(150px,32vw);
    }
    .history-card.all-mode{
      width:100%;
      grid-template-columns:1fr 1fr;
      gap:0;
      min-height:auto;
    }
    .history-side{
      padding:7px 8px;
    }
    .history-mode{font-size:11px;margin-bottom:2px;}
    .history-age{font-size:9px;margin-bottom:6px;line-height:1.1;word-break:break-all;}
    .history-result-main{font-size:12px;}
    .history-result-sub{font-size:9px;margin-top:2px;line-height:1.15;}
    .history-center{
      padding:6px 0;
      gap:8px;
      grid-template-columns:44px minmax(0,1fr);
    }
    .history-champ-box{width:40px;height:40px;}
    .history-champ-box .avatar{width:40px;height:40px;border-radius:8px;}
    .history-summary{gap:2px;min-width:0;}
    .history-player-name{font-size:11px;}
    .history-kda{font-size:12px;}
    .history-ratio{font-size:9px;line-height:1.1;}
    .history-meta{display:none;}
    .history-right{
      padding:6px 8px;
      gap:6px;
      grid-template-columns:1fr 1fr;
    }
    .history-team-list{gap:2px;}
    .history-team-player{
      grid-template-columns:18px minmax(0,1fr);
      gap:4px;
      font-size:9px;
      line-height:1;
      min-width:0;
    }
    .history-team-player .avatar-sm{width:18px;height:18px;}
    .history-overview-side{
      min-height:88px;
      padding:8px 10px;
      gap:8px;
    }
    .history-overview-mark{font-size:24px;min-width:22px;}
    .history-overview-date{font-size:9px;top:6px;right:8px;}
    .history-overview-side.right .history-overview-date{left:8px;}
    /* Champion tab: mobile full-screen toggle */
    .comb-mobile-search{display:block;}
    .comb-search-desktop{display:none !important;}
    .comb-left-panel{width:100% !important;border-right:none !important;padding-right:0 !important;}
    .comb-right-panel{display:none;padding-left:0 !important;}
    .comb-right-panel.mob-active{display:block;}
    .comb-left-panel.mob-hidden{display:none !important;}
    .comb-mobile-back{display:flex !important;align-items:center;gap:8px;margin-bottom:14px;
      padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;

<main><div id="sections"></div></main>

<script>
// ══════════════════════════════════════════
// IMAGE HELPERS
// ══════════════════════════════════════════

// Build champion filename: Korean_English.webp
// champMap is built from CSV data: english → korean
let champMap = {}; // populated after CSV load

// Shared player display names and ordering
const PLAYER_DISPLAY = {
  'TwelveOClock':     '12시',
  'RabiEddin':        '11시',
  'Gomjkhan':         '곰',
  '인왕산와일드보어': '엔디',
  '감귤 아저씨':      '귤아저씨',
  '기장앞바다벨코즈': '그리',
  '행복한욕조견':     '마참',
};
const PLAYER_ORDER = ['12시','11시','곰','엔디','귤아저씨','그리','마참'];

function champImg(english, cls='champ') {
  if (!english || english === 'null') return `<span style="width:40px;height:40px;display:inline-block"></span>`;
  const korean = champMap[english] || '';
  const fname = korean ? `${korean}_${english}.webp` : `${english}.webp`;
  const size = cls.includes('sm') ? 'avatar-sm' : 'avatar';
  return `<img src="champions/${fname}" class="${size} ${cls}" alt="${english}" onerror="this.style.visibility='hidden'">`;
}

function playerImg(name, cls='') {
  const size = cls.includes('sm') ? 'avatar-sm' : 'avatar';
  return `<img src="players/${name}.webp" class="${size} ${cls}" alt="${name}" onerror="this.style.visibility='hidden'">`;
}

// ══════════════════════════════════════════
// CSV PARSER
// ══════════════════════════════════════════
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].replace(/^\uFEFF/,'').split(',').map(h=>h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const row = {};
    headers.forEach((h,j) => row[h] = (vals[j]||'').trim());
    return row;
  }).filter(r => r.summoner_name);
}

// ══════════════════════════════════════════
// DATA PROCESSING
// ══════════════════════════════════════════
function processData(rows) {
  // Build champion map
  rows.forEach(r => {
    if (r.champion && r.champion !== 'null' && r.champion_korean)
      champMap[r.champion] = r.champion_korean;
  });

  const games = {};
  rows.forEach(r => {
    if (!games[r.source_file]) games[r.source_file] = { result: r.result };
  });

  return rows.map(r => {
    const team1Wins = games[r.source_file].result === 'WIN';
    const did_win = r.team_id === '1' ? team1Wins : !team1Wins;
    return { ...r, did_win, kills:+r.kills, deaths:+r.deaths, assists:+r.assists };
  });
}

function groupBy(arr, key) {
  const m = {};
  arr.forEach(r => { if (!m[r[key]]) m[r[key]]=[]; m[r[key]].push(r); });
  return m;
}
function winRate(rows) { return rows.length ? rows.filter(r=>r.did_win).length/rows.length : 0; }
function pct(v) { return (v*100).toFixed(1)+'%'; }
function fix2(v) { return (+v).toFixed(2); }
function rankCls(i) { return i<3?`r${i+1}`:''; }
function wrColor(wr) {
  const green=[40,200,122],orange=[255,149,0],red=[200,62,62];
  let c;
  if (wr>=0.6) c=green;
  else if (wr>=0.5){const t=(wr-0.5)/0.1;c=green.map((g,i)=>Math.round(orange[i]+t*(g-orange[i])));}
  else if (wr>=0.4){const t=(wr-0.4)/0.1;c=red.map((r,i)=>Math.round(r+t*(orange[i]-r)));}
  else c=red;
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function topChampions(rows, limit=3) {
  const byChamp = groupBy(rows.filter(r => r.champion && r.champion !== 'null'), 'champion');
  return Object.entries(byChamp)
    .map(([name, cRows]) => ({ name, picks: cRows.length, wins: cRows.filter(r=>r.did_win).length }))
    .sort((a,b) => b.picks - a.picks || b.wins - a.wins || a.name.localeCompare(b.name, 'ko'))
    .slice(0, limit);
}
function topPlayerBadgeSvg() {
  return `<span class="top-player-badge" aria-hidden="true">
    <svg viewBox="0 0 64 72" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tpbFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9f7cff"/>
          <stop offset="100%" stop-color="#7657d9"/>
        </linearGradient>
      </defs>
      <path d="M4 4h56v45L32 68 4 49Z" fill="url(#tpbFill)" stroke="#8d67ff" stroke-width="4"/>
      <path d="M10 10h44v34L32 57 10 44Z" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/>
      <text x="32" y="39" text-anchor="middle" font-size="26" font-weight="800" fill="#f4f2ff" font-family="Arial, sans-serif">직패</text>
    </svg>
  </span>`;
}
function formatHistoryDate(sourceFile) {
  const m = String(sourceFile || '').match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : String(sourceFile || '');
}

function normalizeMapValue(raw) {
  const v = String(raw || '').trim();
  if (!v) return 'NULL';
  if (v.includes('칼바람')) return '칼바람';
  if (v.includes('도살자')) return '도살자';
  return v;
}

function getRowMapValue(r) {
  return normalizeMapValue(
    r.map ?? r.map_name ?? r.mapName ?? r.game_map ?? r.gameMap ?? r.map_value ?? r.mapValue ?? r.queue_map ?? r.mode_map ?? ''
  );
}

// ══════════════════════════════════════════
// SECTION 1 – Player win rate
// ══════════════════════════════════════════
function buildSection1(enriched) {
  const byPlayer = groupBy(enriched, 'summoner_name');
  const data = Object.entries(byPlayer).map(([name,rows]) => ({
    name,
    rows,
    wr: winRate(rows),
    games: rows.length,
    wins: rows.filter(r=>r.did_win).length,
    topChamps: topChampions(rows, 3)
  })).sort((a,b)=>b.wr-a.wr||b.games-a.games);
  const maxWR = Math.max(...data.map(d=>d.wr));

  const gameCount = [...new Set(enriched.map(r=>r.source_file))].length;
  const strip = `<div class="stat-strip">
    <div class="stat-box"><div class="sv">${Object.keys(byPlayer).length}</div><div class="sl">총 플레이어</div></div>
    <div class="stat-box"><div class="sv">${gameCount}</div><div class="sl">총 게임</div></div>
  </div>`;

  const list = `<div class="rank-list">${data.map((d,i)=>{
    const losses = d.games - d.wins;
    const champRow = d.topChamps.map(c => champImg(c.name, 'sm')).join('');
    const crown = i === 0 ? topPlayerBadgeSvg() : '';
    return `
    <div class="rank-card player-rank-card ${rankCls(i)}">
      <div class="rank-pos">${i+1}${crown}</div>
      ${playerImg(d.name)}
      <div>
        <div class="rank-name-row desktop-only">
          <div class="rank-name-main">
            ${crown}
            <div class="rank-name">${d.name}</div>
          </div>
          <div class="rank-most-champs">${champRow}</div>
          <div class="rank-record-badge">
            <span class="win" style="flex:${d.wins}">${d.wins}승</span>
            <span class="lose" style="flex:${losses}">${losses}패</span>
          </div>
        </div>
        <div class="rank-name mobile-only">${d.name}</div>
        <div class="rank-meta mobile-only">${d.wins}승 ${losses}패 · ${d.games}게임</div>
      </div>
      <div>
        <div class="rank-stat" style="color:${wrColor(d.wr)}">${pct(d.wr)}</div>
        <div class="rank-sub">승률</div>
      </div>
    </div>`;
  }).join('')}</div>`;

  return strip + list;
}

// ══════════════════════════════════════════
// SECTION 2 – Champion pick rate
// ══════════════════════════════════════════
function buildSection2(enriched) {
  const byChamp = groupBy(enriched, 'champion');
  const total = enriched.length;
  const data = Object.entries(byChamp)
    .filter(([n])=>n&&n!=='null')
    .map(([name,rows])=>({
      name, picks:rows.length, pr:rows.length/total,
      wr:winRate(rows), wins:rows.filter(r=>r.did_win).length
    }));

  // Store data on window so the sort buttons can access it
  window._champData = data;

  return `
    <div style="display:flex;gap:8px;margin-bottom:18px;align-items:center">
      <span style="font-size:12px;color:var(--text);letter-spacing:.08em;text-transform:uppercase">정렬 기준:</span>
      <button id="sort-wr"  class="sort-btn active" onclick="sortChampions('wr')">승률</button>
      <button id="sort-pr"  class="sort-btn"        onclick="sortChampions('pr')">픽률</button>
    </div>
    <div id="champ-list"></div>`;
}

function sortChampions(by) {
  const data = window._champData;
  if (!data) return;

  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + by).classList.add('active');

  const sorted = [...data].sort((a,b) => by==='wr'
    ? b.wr - a.wr || b.picks - a.picks
    : b.picks - a.picks || b.wr - a.wr);

  const maxWR   = Math.max(...sorted.map(d=>d.wr));
  const maxPick = Math.max(...sorted.map(d=>d.picks));
  const barMax  = by === 'wr' ? maxWR : maxPick;

  document.getElementById('champ-list').innerHTML =
    `<div class="rank-list">${sorted.map((d,i)=>`
      <div class="rank-card ${rankCls(i)}" style="grid-template-columns:36px 40px 1fr auto auto;cursor:pointer" onclick="navigateToMatchup('${d.name}')" title="상대 챔피언 분석 보기">
        <div class="rank-pos">${i+1}</div>
        ${champImg(d.name)}
        <div>
          <div class="rank-name">${d.name}</div>
          <div class="rank-meta">${d.wins}승 ${d.picks-d.wins}패 · ${d.picks}게임</div>
        </div>
        <div style="text-align:right;min-width:80px">
          <div class="rank-stat" style="font-size:15px;color:${wrColor(d.wr)}">${pct(d.wr)}</div>
          <div class="rank-sub">승률</div>
        </div>
        <div style="text-align:right;min-width:70px;margin-left:16px">
          <div class="rank-stat" style="font-size:15px;color:${by==='pr'?'var(--gold)':'var(--text-lt)'}">${d.picks}픽</div>
          <div class="rank-sub">${pct(d.pr)}</div>
        </div>
      </div>`).join('')}
    </div>`;
}

// buildSection3 merged into buildSection2 above — kept as stub for builder array compatibility
function buildSection3(enriched) { return ''; }

// ══════════════════════════════════════════
// SECTION 4 – Per-player teammate win rate
// ══════════════════════════════════════════
function buildSection4(enriched) {
  const players = [...new Set(enriched.map(r=>r.summoner_name))].sort();

  function getTeammateWRs(player) {
    const myGames = {};
    enriched.forEach(r => { if (r.summoner_name===player) myGames[r.source_file+'_'+r.team_id]=r.did_win; });
    const tm = {};
    enriched.forEach(r => {
      const key = r.source_file+'_'+r.team_id;
      if (r.summoner_name!==player && myGames[key]!==undefined) {
        if (!tm[r.summoner_name]) tm[r.summoner_name]={wins:0,games:0};
        tm[r.summoner_name].games++;
        if (myGames[key]) tm[r.summoner_name].wins++;
      }
    });
    return Object.entries(tm).map(([name,s])=>({name,wr:s.wins/s.games,wins:s.wins,games:s.games}))
      .sort((a,b)=>b.wr-a.wr||b.games-a.games);
  }

  const panels = players.map((p,pi) => {
    const tms = getTeammateWRs(p);
    const maxTmWR = tms.length ? Math.max(...tms.map(t=>t.wr)) : 1;
    return `<div class="player-content ${pi===0?'active':''}" id="s2-${pi}">
      ${tms.length===0 ? `<div class="empty">팀원 데이터 없음</div>` :
        `<div class="rank-list">${tms.map((t,i)=>`
          <div class="rank-card ${rankCls(i)}" style="grid-template-columns:36px 40px 1fr 110px">
            <div class="rank-pos">${i+1}</div>
            ${playerImg(t.name)}
            <div>
              <div class="rank-name">${t.name}</div>
              <div class="rank-meta">${t.wins}승 ${t.games-t.wins}패 · 함께 ${t.games}게임</div>
            </div>
            <div>
              <div class="rank-stat" style="color:${wrColor(t.wr)}">${pct(t.wr)}</div>
              <div class="rank-sub">함께 승률</div>
            </div>
          </div>`).join('')}</div>`}
    </div>`;
  }).join('');

  const btns = players.map((p,i)=>
    `<button class="player-btn ${i===0?'active':''}" onclick="switchPlayer('s2',${i},this)">
      ${playerImg(p,'sm')} <span class="btn-label">${p}</span>
    </button>`).join('');

  return `<div class="player-select">${btns}</div>${panels}`;
}

// ══════════════════════════════════════════
// SECTION 5 – Per-player champion stats
// ══════════════════════════════════════════
function buildSection5(enriched) {
  const players = [...new Set(enriched.map(r=>r.summoner_name))].sort();

  const panels = players.map((p,pi) => {
    const pRows = enriched.filter(r=>r.summoner_name===p);
    const byChamp = groupBy(pRows, 'champion');
    const data = Object.entries(byChamp)
      .filter(([n])=>n&&n!=='null')
      .map(([name,rows])=>({
        name, wr:winRate(rows), picks:rows.length,
        wins:rows.filter(r=>r.did_win).length, pr:rows.length/pRows.length
      })).sort((a,b)=>b.wr-a.wr||b.picks-a.picks);

    const byWR = `<div class="mini-list">${data.map((d,i)=>`
      <div class="mini-row ${rankCls(i)}" style="cursor:pointer" onclick="navigateToMatchup('${d.name}')" title="상대 챔피언 분석 보기">
        <span class="mini-pos">${i+1}</span>
        ${champImg(d.name,'champ sm')}
        <span class="mini-name">${d.name}</span>
        <span class="mini-val" style="color:${wrColor(d.wr)}">${pct(d.wr)}</span>
        <span class="mini-sub">${d.wins}W/${d.picks-d.wins}L</span>
      </div>`).join('')}</div>`;

    const byPick = `<div class="mini-list">${[...data].sort((a,b)=>b.picks-a.picks).map((d,i)=>`
      <div class="mini-row ${rankCls(i)}" style="cursor:pointer" onclick="navigateToMatchup('${d.name}')" title="상대 챔피언 분석 보기">
        <span class="mini-pos">${i+1}</span>
        ${champImg(d.name,'champ sm')}
        <span class="mini-name">${d.name}</span>
        <span class="mini-val">${d.picks}픽</span>
        <span class="mini-sub">${pct(d.pr)}</span>
      </div>`).join('')}</div>`;

    return `<div class="player-content ${pi===0?'active':''}" id="s4-${pi}">
      <div class="two-col">
        <div class="sub-panel"><h3>챔피언별 승률</h3>${data.length?byWR:'<div class="empty">데이터 없음</div>'}</div>
        <div class="sub-panel"><h3>챔피언별 픽률</h3>${data.length?byPick:'<div class="empty">데이터 없음</div>'}</div>
      </div>
    </div>`;
  }).join('');

  const btns = players.map((p,i)=>
    `<button class="player-btn ${i===0?'active':''}" onclick="switchPlayer('s4',${i},this)">
      ${playerImg(p,'sm')} <span class="btn-label">${p}</span>
    </button>`).join('');

  return `<div class="player-select">${btns}</div>${panels}`;
}

// ══════════════════════════════════════════
// SECTION 6 – Player KDA
// ══════════════════════════════════════════
function buildSection6(enriched) {
  const byPlayer = groupBy(enriched, 'summoner_name');
  const data = Object.entries(byPlayer).map(([name,rows]) => {

// ══════════════════════════════════════════
// MATCHUP DATA HELPER
// ══════════════════════════════════════════
function computeMatchups(enriched) {
  const byGame = {};
  enriched.forEach(r => {
    if (!r.champion || r.champion === 'null') return;
    if (!byGame[r.source_file]) byGame[r.source_file] = { team1: [], team2: [] };
    if (r.team_id === '1') byGame[r.source_file].team1.push({ champ: r.champion, did_win: r.did_win });
    else                    byGame[r.source_file].team2.push({ champ: r.champion, did_win: r.did_win });
  });

  const mu = {}; // vs opponents
  const sy = {}; // with allies

  function record(map, keyA, keyB, won) {
    if (!map[keyA])          map[keyA]          = {};
    if (!map[keyA][keyB])    map[keyA][keyB]    = { wins: 0, games: 0 };
    map[keyA][keyB].games++;
    if (won) map[keyA][keyB].wins++;
  }

  Object.values(byGame).forEach(({ team1, team2 }) => {
    // Matchups: cross-team pairs
    team1.forEach(a => team2.forEach(b => {
      record(mu, a.champ, b.champ, a.did_win);
      record(mu, b.champ, a.champ, b.did_win);
    }));

    // Synergies: same-team pairs
    [team1, team2].forEach(team => {
      for (let i = 0; i < team.length; i++)
        for (let j = i + 1; j < team.length; j++) {
          record(sy, team[i].champ, team[j].champ, team[i].did_win);
          record(sy, team[j].champ, team[i].champ, team[j].did_win);
        }
    });
  });

  return { mu, sy };
}

// ══════════════════════════════════════════
// TRIPLET DATA HELPER
// ══════════════════════════════════════════
function computeCombos(enriched, size) {
  // Group by game+team
  const gameTeams = {};
  enriched.forEach(r => {
    const key = r.source_file + '|' + r.team_id;
    if (!gameTeams[key]) gameTeams[key] = { did_win: r.did_win, members: [] };
    gameTeams[key].members.push(r.summoner_name);
  });

  const stats = {};
  Object.values(gameTeams).forEach(({ did_win, members }) => {
    const sorted = [...new Set(members)].sort();
    const combos = getCombinations(sorted, size);
    combos.forEach(combo => {
      const key = combo.join(' + ');
      if (!stats[key]) stats[key] = { wins: 0, games: 0, members: combo };
      stats[key].games++;
      if (did_win) stats[key].wins++;
    });
  });

  return Object.entries(stats).map(([key, s]) => ({
    key, members: s.members,
    wr: s.wins / s.games, wins: s.wins, games: s.games
  }));
}

function getCombinations(arr, k) {
  if (k === 1) return arr.map(x => [x]);
  const result = [];
  for (let i = 0; i <= arr.length - k; i++) {
    const rest = getCombinations(arr.slice(i + 1), k - 1);
    rest.forEach(r => result.push([arr[i], ...r]));
  }
  return result;
}

// ── Player win-rate matrix ────────────────────────────────
function computePlayerMatrix(enriched) {
  const ally  = {};  // sorted "p1|p2" → {wins, games}
  const enemy = {};  // directional "p1|p2" → {wins, games} from p1's perspective

  const games = {};
  enriched.forEach(r => {
    if (!games[r.source_file]) games[r.source_file] = {};
    if (!games[r.source_file][r.team_id])
      games[r.source_file][r.team_id] = { did_win: r.did_win, members: [] };
    games[r.source_file][r.team_id].members.push(r.summoner_name);
  });

  Object.values(games).forEach(teams => {
    const tids = Object.keys(teams);
    if (tids.length !== 2) return;
    const t1 = teams[tids[0]], t2 = teams[tids[1]];

    // Ally pairs within each team
    [t1, t2].forEach(team => {
      const ms = [...new Set(team.members)];
      for (let i = 0; i < ms.length; i++) {
        for (let j = i + 1; j < ms.length; j++) {
          const key = [ms[i], ms[j]].sort().join('|');
          if (!ally[key]) ally[key] = { wins: 0, games: 0 };
          ally[key].games++;
          if (team.did_win) ally[key].wins++;
        }
      }
    });

    // Enemy pairs across teams
    const m1 = [...new Set(t1.members)];
    const m2 = [...new Set(t2.members)];
    m1.forEach(p1 => m2.forEach(p2 => {
      const k12 = p1 + '|' + p2;
      if (!enemy[k12]) enemy[k12] = { wins: 0, games: 0 };
      enemy[k12].games++;
      if (t1.did_win) enemy[k12].wins++;

      const k21 = p2 + '|' + p1;
      if (!enemy[k21]) enemy[k21] = { wins: 0, games: 0 };
      enemy[k21].games++;
      if (t2.did_win) enemy[k21].wins++;
    }));
  });

  const players = [...new Set(enriched.map(r => r.summoner_name))];
  return { ally, enemy, players };
}

  el.innerHTML = `<div class="pm2-wrap">

      <tbody>${rows}</tbody>

      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:10px;
                  background:var(--panel);border:1px solid var(--border);border-radius:8px;
                  max-height:190px;overflow-y:auto;">${grid}</div>
    </div>
    <div id="mu-info" style="display:flex;align-items:center;gap:12px;margin-bottom:16px;
         padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;min-height:64px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
      <span style="font-size:12px;color:var(--text);letter-spacing:.08em;text-transform:uppercase">정렬:</span>
      <button id="mu-sort-wr"    class="sort-btn active" onclick="sortMu('wr')">승률</button>
      <button id="mu-sort-games" class="sort-btn"        onclick="sortMu('games')">게임 수</button>
    </div>
    <div class="two-col">
      <div class="sub-panel">
        <h3>상대 챔피언 승률 (카운터)</h3>
        <div id="mu-vs-table"></div>
      </div>
      <div class="sub-panel">
        <h3>아군 챔피언 시너지</h3>
        <div id="mu-ally-table"></div>
      </div>
    </div>`;
}

function filterMuChamps(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.champ-mu-btn').forEach(btn => {
    const en = btn.title.toLowerCase();
    const kr = (champMap[btn.title] || '').toLowerCase();
    btn.style.display = (!q || en.includes(q) || kr.includes(q)) ? '' : 'none';
  });
}

function selectMuChamp(champ, btn) {
  document.querySelectorAll('.champ-mu-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMuTable(champ);
}

function sortMu(by) {
  window._muSortBy = by;
  document.getElementById('mu-sort-wr').classList.toggle('active',    by === 'wr');
  document.getElementById('mu-sort-games').classList.toggle('active', by === 'games');
  const active = document.querySelector('.champ-mu-btn.active');
  if (active) renderMuTable(active.title);
}

function renderMuList(map, champ, containerId, sortBy, filterFn, emptyMsg, reversed) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!map || !map[champ]) { el.innerHTML = `<div class="empty">${emptyMsg || '데이터 없음'}</div>`; return; }

  sortBy = sortBy || window._muSortBy || 'wr';
  let entries = Object.entries(map[champ])
    .map(([other, s]) => ({ other, wr: s.wins / s.games, wins: s.wins, games: s.games }));

  if (filterFn) entries = entries.filter(filterFn);

  entries.sort((a, b) => {
    const d = sortBy === 'wr' ? b.wr - a.wr || b.games - a.games : b.games - a.games || b.wr - a.wr;
    return reversed ? -d : d;
  });

  if (!entries.length) { el.innerHTML = `<div class="empty">${emptyMsg || '데이터 없음'}</div>`; return; }

  el.innerHTML = `<div class="rank-list">${entries.map((d, i) => `
    <div class="rank-card ${rankCls(i)}" style="grid-template-columns:36px 40px 1fr 110px">
      <div class="rank-pos">${i + 1}</div>
      ${champImg(d.other)}
      <div>
        <div class="rank-name">${d.other}</div>
        <div class="rank-meta mu-record">${d.wins}승 ${d.games - d.wins}패 · ${d.games}게임</div>
      </div>
      <div>
        <div class="rank-stat" style="color:${wrColor(d.wr)}">${pct(d.wr)}</div>
        <div class="rank-sub mu-sub-label">승률</div>
        <div class="rank-sub mu-sub-record">${d.wins}승 ${d.games - d.wins}패 ${d.games}게임</div>
      </div>
    </div>`).join('')}
  </div>`;
}

function renderMuTable(champ) {
  const champRows = (window._enriched || []).filter(r => r.champion === champ);
  const totalGames = champRows.length;
  const totalWins  = champRows.filter(r => r.did_win).length;
  const overallWR  = totalGames ? totalWins / totalGames : 0;

  document.getElementById('mu-info').innerHTML = `
    ${champImg(champ, 'champ')}
    <div>
      <div style="font-size:17px;font-weight:700;color:var(--text-lt)">${champ}</div>
      <div style="font-size:12px;color:var(--text);margin-top:3px">
        ${totalGames}게임 · ${totalWins}승 ${totalGames - totalWins}패 ·
        종합 승률 <span style="color:${wrColor(overallWR)};font-weight:700">${pct(overallWR)}</span>
      </div>
    </div>`;

  renderMuList(window._matchups,  champ, 'mu-vs-table');
  renderMuList(window._synergies, champ, 'mu-ally-table');
}

// ══════════════════════════════════════════
// SECTION 10 – Combined: Champion + Matchup
// ══════════════════════════════════════════
function buildSectionCombined(enriched) {
  // Champion stats (formerly built by buildSection2)
  const byChamp = groupBy(enriched, 'champion');
  const total   = enriched.length;
  window._champData = Object.entries(byChamp)
    .filter(([n]) => n && n !== 'null')
    .map(([name, rows]) => ({
      name, picks: rows.length, pr: rows.length / total,
      wr: winRate(rows), wins: rows.filter(r => r.did_win).length
    }));

  // Matchup + synergy data (formerly built by buildSectionMatchup)
  const { mu, sy }  = computeMatchups(enriched);
  window._matchups  = mu;
  window._synergies = sy;
  window._muSortBy  = 'wr';

  window._combSortBy     = 'wr';
  window._combMuSortBy   = 'wr';
  window._combActiveView = 'vs';
  window._combActiveChamp = null;

  return `
    <input id="comb-mobile-search" class="comb-mobile-search" type="text"
      placeholder="챔피언 검색…" oninput="filterCombinedList(this.value)"
      style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;
             color:var(--text-lt);padding:7px 10px;font-family:'Rajdhani',sans-serif;
             font-size:13px;outline:none;width:100%;box-sizing:border-box;margin-bottom:10px;">
    <div style="display:flex;gap:0;align-items:flex-start">

      <!-- LEFT: champion list -->
      <div class="comb-left-panel" style="width:22%;flex-shrink:0;border-right:1px solid var(--border);padding-right:14px;">
        <input id="comb-search" type="text" placeholder="챔피언 검색…"
          oninput="filterCombinedList(this.value)"
          class="comb-search-desktop"
          style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;
                 color:var(--text-lt);padding:5px 8px;font-family:'Rajdhani',sans-serif;
                 font-size:12px;outline:none;width:100%;margin-bottom:10px;box-sizing:border-box;display:block;">
        <div id="comb-champ-list"></div>
      </div>

      <!-- RIGHT: matchup analysis (~80%) -->
      <div class="comb-right-panel" style="flex:1;min-width:0;padding-left:20px;">
        <button class="comb-mobile-back" onclick="combMobileBack()">← 목록으로</button>
        <div id="comb-mu-info" style="display:flex;align-items:center;gap:12px;margin-bottom:16px;
             padding:12px 16px;background:var(--bg2);border:1px solid var(--border);
             border-radius:6px;min-height:64px;">
          <div style="color:var(--text);font-size:13px">← 왼쪽에서 챔피언을 선택하세요</div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
          <button id="comb-view-ally"   class="sort-btn"        onclick="showCombinedPanel('ally')">아군 챔피언 시너지</button>
          <button id="comb-view-vs"     class="sort-btn active" onclick="showCombinedPanel('vs')">카운터</button>
          <button id="comb-view-strong" class="sort-btn"        onclick="showCombinedPanel('strong')">강세 챔피언</button>
        </div>
        <div>
          <div class="sub-panel comb-panel" id="comb-panel-ally"><h3>아군 챔피언 시너지</h3><div id="comb-mu-ally-table"></div></div>
          <div class="sub-panel comb-panel active" id="comb-panel-vs"><h3>카운터</h3><div id="comb-mu-vs-table"></div></div>
          <div class="sub-panel comb-panel" id="comb-panel-strong"><h3>강세 챔피언</h3><div id="comb-mu-strong-table"></div></div>
        </div>
      </div>

    </div>`;
}

function renderCombinedChampList(by) {
  const data = window._champData;
  if (!data) return;
  by = by || window._combSortBy || 'wr';
  window._combSortBy = by;
  const sorted = [...data].sort((a, b) => by === 'wr'
    ? b.wr - a.wr || b.picks - a.picks
    : b.picks - a.picks || b.wr - a.wr);
  window._combSorted = sorted;
  _renderCombinedList(sorted);
}

function filterCombinedList(q) {
  if (window._combSorted) _renderCombinedList(window._combSorted);
}

function _renderCombinedList(sorted) {
  const el = document.getElementById('comb-champ-list');
  if (!el) return;
  const q = (document.getElementById('comb-search')?.value || document.getElementById('comb-mobile-search')?.value || '').toLowerCase();
  const active = window._combActiveChamp;
  const by = window._combSortBy || 'wr';
  const visible = sorted.filter(d =>
    !q || d.name.toLowerCase().includes(q) || (champMap[d.name]||'').toLowerCase().includes(q));
  const header = `<div class="comb-champ-thead">
    <span class="comb-th" style="grid-column:1;text-align:center">#</span>
    <span class="comb-th" style="grid-column:3/5">챔피언</span>
    <span class="comb-th sortable ${by==='wr'?'sort-active':''}" style="grid-column:5;text-align:center" onclick="renderCombinedChampList('wr')">승률</span>
    <span class="comb-th sortable ${by==='pr'?'sort-active':''}" style="grid-column:6;text-align:center" onclick="renderCombinedChampList('pr')">픽률</span>
  </div>`;
  const rows = visible.map((d, i) => {
    const isActive = d.name === active;
    return `<div class="comb-champ-row ${isActive?'active':''}" onclick="selectCombinedChamp('${d.name}')">
      <span style="grid-column:1;font-size:10px;color:var(--text);text-align:center">${i+1}</span>
      <span style="grid-column:3">${champImg(d.name,'champ sm')}</span>
      <span style="grid-column:4;font-size:11px;font-weight:600;color:${isActive?'var(--gold-lt)':'var(--text-lt)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.name}</span>
      <span style="grid-column:5;font-size:11px;font-weight:700;color:${wrColor(d.wr)};text-align:center">${pct(d.wr)}</span>
      <span style="grid-column:6;font-size:11px;color:var(--text-lt);text-align:center">${pct(d.pr)}</span>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="comb-champ-table">${header}${rows}</div>`;
}

function selectCombinedChamp(champ) {
  window._combActiveChamp = champ;
  _renderCombinedList(window._combSorted || []);
  _renderCombinedMatchup(champ);
  if (window.innerWidth <= 760) {
    document.querySelector('.comb-left-panel')?.classList.add('mob-hidden');
    document.querySelector('.comb-right-panel')?.classList.add('mob-active');
  }
}
function combMobileBack() {
  document.querySelector('.comb-left-panel')?.classList.remove('mob-hidden');
  document.querySelector('.comb-right-panel')?.classList.remove('mob-active');
}

function sortCombinedMu(by) {
  window._combMuSortBy = by;
  if (window._combActiveChamp) _renderCombinedMatchup(window._combActiveChamp);
}

function showCombinedPanel(view) {
  window._combActiveView = view;
  document.getElementById('comb-view-vs')?.classList.toggle('active', view === 'vs');
  document.getElementById('comb-view-ally')?.classList.toggle('active', view === 'ally');
  document.getElementById('comb-view-strong')?.classList.toggle('active', view === 'strong');
  document.querySelectorAll('.comb-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`comb-panel-${view}`)?.classList.add('active');
}

function _renderCombinedMatchup(champ) {
  const champRows  = (window._enriched || []).filter(r => r.champion === champ);
  const totalGames = champRows.length;
  const totalWins  = champRows.filter(r => r.did_win).length;
  const overallWR  = totalGames ? totalWins / totalGames : 0;

  document.getElementById('comb-mu-info').innerHTML = `
    ${champImg(champ, 'champ')}
    <div>
      <div style="font-size:17px;font-weight:700;color:var(--text-lt)">${champ}</div>
      <div style="font-size:12px;color:var(--text);margin-top:3px">
        ${totalGames}게임 · ${totalWins}승 ${totalGames - totalWins}패 ·
        종합 승률 <span style="color:${wrColor(overallWR)};font-weight:700">${pct(overallWR)}</span>
      </div>
    </div>`;

  const sb = window._combMuSortBy || 'wr';
  renderMuList(window._matchups,  champ, 'comb-mu-vs-table',     sb, e => e.wr < 0.5, '비대칭 전력', true);
  renderMuList(window._synergies, champ, 'comb-mu-ally-table',   sb);
  renderMuList(window._matchups,  champ, 'comb-mu-strong-table', sb, e => e.wr > 0.5);
}

// ══════════════════════════════════════════
// UI HELPERS
// ══════════════════════════════════════════
function navigateToMatchup(champ) {
  const tabBtn = document.querySelector('.tab[data-section="s9"]');
  if (tabBtn) switchTab('s9', tabBtn);
  if (!window._combSorted) renderCombinedChampList('wr');
  selectCombinedChamp(champ);
}

function switchPlayer(sec, idx, btn) {
  const parent = btn.closest('.section');
  parent.querySelectorAll('.player-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  parent.querySelectorAll('.player-content').forEach(p=>p.classList.remove('active'));
  parent.querySelector(`#${sec}-${idx}`)?.classList.add('active');
}

function getRouteFromLocation() {
  const hashRoute = location.hash.replace(/^#\/?/, '').trim();
  if (ID_BY_ROUTE[hashRoute]) return hashRoute;

  const pathParts = location.pathname.split('/').filter(Boolean);
  const lastPart = pathParts[pathParts.length - 1] || '';
  if (ID_BY_ROUTE[lastPart]) return lastPart;

  return TABS[0].route;
}

function setActiveSection(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelector(`.tab[data-section="${id}"]`)?.classList.add('active');
  document.getElementById(id)?.classList.add('active');
}

function updateRoute(id) {
  const route = ROUTE_BY_ID[id] || TABS[0].route;
  const nextUrl = `${location.pathname}${location.search}#${route}`;
  history.replaceState(null, '', nextUrl);
}

function activateRoute(route) {
  const id = ID_BY_ROUTE[route] || TABS[0].id;
  setActiveSection(id);
}

function switchTab(id, btn, shouldUpdateRoute = true) {
  setActiveSection(id);
  if (btn) btn.classList.add('active');
  if (shouldUpdateRoute) updateRoute(id);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
const TABS = [
  {id:'s1',label:'플레이어 승률', route:'player_win_rate'},
  {id:'s2',label:'팀원별 승률', route:'teammate_win_rate'},
  {id:'s3',label:'조합 분석', route:'combo_analysis'},
  {id:'s4',label:'플레이어 챔피언', route:'player_champions'},
  {id:'s5',label:'전체 전적', route:'match_history'},
  {id:'s6',label:'KDA · 다양성', route:'kda_diversity'},
  {id:'s9',label:'챔피언', route:'champions'},
];
const ROUTE_BY_ID = Object.fromEntries(TABS.map(t => [t.id, t.route]));
const ID_BY_ROUTE = Object.fromEntries(TABS.map(t => [t.route, t.id]));
const DESCRIPTIONS = [
  '플레이어 승률 순위','플레이어별 팀원 승률 순위',
  '2인 · 3인 조합 승률 분석','플레이어별 챔피언 승률 · 픽률',
  '전체 매치 히스토리',
  'KDA 랭킹 · 챔피언 다양성',
  '챔피언 승률 · 카운터 · 시너지 통합 보기',
];

async function init() {
  try {
    const resp = await fetch('lol_dataset.csv');
    if (!resp.ok) throw new Error('lol_dataset.csv 파일을 찾을 수 없습니다.');
    const enriched = processData(parseCSV(await resp.text()));

    document.getElementById('nav').innerHTML =
      `<div style="display:flex;margin:0 auto">${TABS.map((t,i)=>
        `<button class="tab ${i===0?'active':''}" data-section="${t.id}" data-route="${t.route}" onclick="switchTab('${t.id}',this)">${t.label}</button>`
      ).join('')}</div>`;

    const builders = [
      ()=>buildSection1(enriched), ()=>buildSection4(enriched),
      ()=>buildSection8(enriched), ()=>buildSection5(enriched),
      ()=>buildSectionHistory(enriched),
      ()=>buildSection67(enriched),
      ()=>buildSectionCombined(enriched),
    ];

    document.getElementById('sections').innerHTML = TABS.map((t,i)=>`
      <div class="section ${i===0?'active':''}" id="${t.id}">
        <div class="sec-title"><div class="num">${i+1}</div>${DESCRIPTIONS[i]}</div>
        ${builders[i]()}
      </div>`).join('');
    renderMatchHistory();

    const gameCount = [...new Set(enriched.map(r=>r.source_file))].length;
    const playerCount = [...new Set(enriched.map(r=>r.summoner_name))].length;
    document.getElementById('header-meta').textContent =
      `${gameCount}게임 · ${playerCount}명 · ${enriched.length}개 전적`;
    window._enriched = enriched;
    // Initial triplet render after DOM is set
    setTimeout(() => {
      renderTripletViz(enriched);
      renderPlayerMatrix('ally');
      renderCombinedChampList('wr');
      activateRoute(getRouteFromLocation());
    }, 50);

    window.addEventListener('hashchange', () => {
      activateRoute(getRouteFromLocation());
    });

    document.getElementById('loading').style.display='none';

  } catch(e) {
    document.getElementById('loading').innerHTML = `
      <div style="color:var(--red);font-family:'Cinzel',serif;text-align:center;padding:24px">
        <div style="font-size:32px;margin-bottom:16px">⚠</div>
        <div>${e.message}</div>
        <div style="margin-top:12px;font-size:12px;color:var(--text)">
          HTML 파일과 같은 폴더에 lol_dataset.csv, champions/, players/ 폴더를 넣고<br>
          로컬 서버(VS Code Live Server 또는 python -m http.server)에서 열어주세요.
        </div>
      </div>`;
  }
}
init();
</script>
